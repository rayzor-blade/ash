name: test

# The crate's own unit tests. Nothing ran them before: `parity_gate` runs the
# parity INTEGRATION tests, and `lint` only compiles tests under clippy, so a
# `#[test]` in ash_std could fail forever without anyone noticing.
#
# The second job is the one that would have caught the bug this file was
# written for. A user reported `natives resolved, 1 missing: std@hlp_gc_stats`;
# it turned out to be 47 of HashLink's 313 primitives, and no unit test can see
# that class -- the VM resolves primitives BY NAME from the export table, so a
# missing or misspelled `#[no_mangle]` is a runtime failure in someone else's
# program, never a build error here.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    env:
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          # ash_std's build script runs bindgen, which shells out to
          # rustfmt. lint and parity_gate both ask for it for the same
          # reason.
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - uses: ./.github/actions/llvm21

      # ash_std first: its cdylib is embedded by the other crates' build
      # scripts, same ordering the lint job needs.
      - name: Build the embedded stdlib
        run: cargo build -p ash_std

      # Serialised on purpose. Tests that force a collection deadlock against
      # tests that register themselves as GC mutators: the collector's
      # stop-the-world waits for every registered mutator to park at a
      # safepoint, and a test thread sitting inside a prim never does. It hangs
      # roughly one run in seven, spinning every core until killed.
      - name: Test ash_std
        run: cargo test -p ash_std -- --test-threads=1

      - name: Test ash_core
        run: cargo test -p ash_core --lib

      # What ash can compile FOR, as opposed to what it runs on. Emitting an
      # object for a 32-bit or big-endian target is the only thing that
      # exercises those TargetAbi paths outside a wasm build, and the check is
      # cheap: emit, then read the ELF header for word size and architecture.
      # Nothing links or runs these -- there is no toolchain here for RISC-V
      # or s390x -- so this gates the ABI, not the platform.
      - name: Cross-target emission
        run: cargo test -p ash --test cross_targets

  primitive-exports:
    name: primitive export gap
    runs-on: ubuntu-24.04
    env:
      # ash_std pulls in no inkwell, but its build script runs bindgen, so it
      # needs a libclang matching the pinned bindgen release just as much as a
      # full build does.
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          # ash_std's build script runs bindgen, which shells out to
          # rustfmt. lint and parity_gate both ask for it for the same
          # reason.
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: exports

      - uses: ./.github/actions/llvm21

      # Source only. The comparison is against what HashLink DECLARES, so
      # nothing on this side needs building.
      - name: Fetch the HashLink primitive surface
        run: git clone --depth 1 https://github.com/HaxeFoundation/hashlink /tmp/hashlink

      - name: Build the embedded stdlib
        run: cargo build -p ash_std

      - name: Compare exports against DEFINE_PRIM
        run: ./scripts/check_primitive_exports.sh /tmp/hashlink

  hdll-callbacks:
    # The corpus links real shared libraries, resolves primitives by name from
    # an export table, and drives real collections -- every one of which the
    # platform decides. A macOS-only run said nothing about the Windows report
    # that started this work, and the first Linux run failed all 111 rows,
    # which a single-platform gate would never have shown.
    name: hdll callback corpus (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      HAXE_VERSION: "4.3.4"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt # bindgen pretty-prints through it

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: corpus-${{ matrix.os }}

      # krdlab/setup-haxe has no arm64 build and fails outright on macos-14
      # with "arm64 not supported", so Apple Silicon takes it from Homebrew.
      - uses: krdlab/setup-haxe@v1
        if: runner.os != 'macOS'
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxe (macOS)
        if: runner.os == 'macOS'
        run: brew install haxe

      - uses: ./.github/actions/llvm21

      - name: Build the runtime
        shell: bash
        run: |
          cargo build -p ash_std
          cargo build -p ash

      # Windows cannot start the binary without these beside it.
      - uses: ./.github/actions/llvm21-runtime-dlls
        if: runner.os == 'Windows'
        with:
          into: target\debug\

      # A platform with no recorded baseline prints its matrix and passes: a
      # first run there is a measurement, not a verdict. It starts gating once
      # its expectations are committed.
      - name: Run the callback corpus
        shell: bash
        run: |
          # Git Bash on the Windows image ships `python`, not `python3`.
          command -v python3 >/dev/null && PY=python3 || PY=python
          "$PY" scripts/hdll_callbacks.py --timeout 60
