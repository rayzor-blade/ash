# Edge cases for the Math primitives both JIT tiers emit as instructions rather
# than calls (crates/ash/src/intrinsics.rs). The point of the case is that the
# obvious instruction is wrong twice over: HashLink's round is floor(x + 0.5),
# which disagrees with IEEE at negative halves, and the Int-returning forms
# saturate on NaN and overflow where a plain fptosi is poison. Every engine must
# agree with the interpreter here.
[[case]]
name = "MathIntrinsics"
main = "MathIntrinsics"
hl = "test_math_intrinsics.hl"
slow = false
timeout_secs = 60
expectation = "exact"
normalize = "default"
# Judged against ash's interpreter, not the eval target. Two of the values
# here are ones Haxe leaves to the target, so an external oracle asserts its
# own answer rather than a correct one: ash saturates an out-of-range
# float->int by design (the header of MathIntrinsics.hx says so, and
# intrinsics.rs implements it) where eval wraps, and ash formats floats with
# HashLink's %.15g where eval prints seventeen digits. The property this case
# exists to defend is the one its own header states -- every engine agrees
# with the interpreter -- and that is what this now checks.
oracle_is_interp = true

# Address-taken locals (hl.Ref) exercising AIR v2's cell machinery — the
# marblegame (MBHaxe) refusal shapes; see TestRefCells.hx for the two
# CellForwarding defects these pin down. Judged against ash's interpreter
# because eval cannot run the hl package (no --interp sanity either).
[[case]]
name = "TestRefCells"
main = "TestRefCells"
hl = "test_ref_cells.hl"
slow = false
timeout_secs = 60
expectation = "exact"
normalize = "default"
sanity_interp = false
oracle_is_interp = true

# Compiled HVIRTUAL dispatch under heap pressure — the shape a heaps/MBHaxe
# scene load has, and one no other case in this corpus covers: a survey of the
# existing benchmarks (deltablue, binary_trees, method_call, closure_call,
# field_access, stdlib) found ZERO calls into hlp_vcall_dyn, so the whole suite
# stays green through changes that rewrite dynamic dispatch. Two attempts at
# that rewrite passed parity, stdlib and 1069/1069 unit conformance and then
# hung MarbleGame with a >1GB heap.
#
# Both ingredients matter. Calls go through a structural type so compiled code
# lowers them to hlp_vcall_dyn rather than a vtable slot; and the benchmark
# RETAINS a large object graph, because with a tiny live set every collection
# is cheap and per-dispatch garbage stays invisible. The elapsed_ms line is
# informational — the checksum is the gate.
[[case]]
name = "BenchDynDispatch"
main = "BenchDynDispatch"
hl = "bench_dyn_dispatch.hl"
slow = false
timeout_secs = 120
expectation = "exact"
normalize = "default"
sanity_interp = false
oracle_is_interp = true

# The vectorizer's remainder handling, which is where widening stops being a
# missed optimization and becomes a wrong answer. Lengths 0..12 straddle the
# width of 4 in every way that matters: shorter than a vector, exactly one,
# and every offset in between, for both an int store and a float
# read-modify-write. A widened loop that runs one vector too far or skips the
# tail changes the checksum, and it changes it silently.
[[case]]
name = "TestVectorize"
main = "TestVectorize"
hl = "test_vectorize.hl"
slow = false
timeout_secs = 60
expectation = "exact"
normalize = "default"

# A Haxe throw escaping a COMPILED frame. The exception is ordinary control
# flow, but it arrives at the interpreter as an error out of the compiled call
# boundary, and reading that as a compile failure both retired the findex for
# the rest of the run and re-executed the function from its first opcode --
# duplicating every side effect the compiled attempt had already committed.
# The checksum is `sideEffects`, which must equal the call count: the bug
# printed 400001 in hybrid against 400000 everywhere else. This only bites
# once the function is actually promoted, so it needs the hybrid rows.
[[case]]
name = "TestThrowAcrossTiers"
main = "TestThrowAcrossTiers"
hl = "test_throw_across_tiers.hl"
slow = false
timeout_secs = 180
expectation = "exact"
normalize = "default"

# A virtual (interface-typed value) cast back to its class. Runs once per
# program, so the interpreter always executed it and only a whole-module
# compile ever runs it compiled -- which is where it read a method pointer as
# an object and stored into code. Needs the JIT rows.
[[case]]
name = "TestSafeCastVirtual"
main = "TestSafeCastVirtual"
hl = "test_safe_cast_virtual.hl"
slow = false
timeout_secs = 180
expectation = "exact"
normalize = "default"

# A null Dynamic's type is the void type (hl_typeof(NULL)). Read by
# Type.typeof, Reflect.isFunction and the JSON printer; runs once, so only a
# whole-program compile executes it compiled.
[[case]]
name = "TestGetTypeNull"
main = "TestGetTypeNull"
hl = "test_gettype_null.hl"
slow = false
timeout_secs = 180
expectation = "exact"
normalize = "default"
