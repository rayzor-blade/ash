name: perf_smoke

on:
  workflow_dispatch:
    inputs:
      include_slow:
        description: "Include slow case (Mandelbrot)"
        required: false
        default: "false"
      min_speedup:
        description: "Optional minimum interp/hybrid median speedup threshold"
        required: false
        default: "0"
  schedule:
    - cron: "0 7 * * *"

jobs:
  perf:
    runs-on: ubuntu-22.04
    env:
      HAXE_VERSION: "4.3.4"
      LLVM_SYS_211_PREFIX: "/usr/lib/llvm-21"
      CARGO_BUILD_TARGET: "x86_64-unknown-linux-gnu"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@nightly

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install LLVM 21 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gpg software-properties-common \
            libzstd-dev zlib1g-dev libxml2-dev libtinfo-dev libedit-dev libffi-dev
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all
          llvm-config-21 --version
          clang-21 --version

      - name: Build embedded stdlib cdylib
        run: cargo build -p ash_std --target "${CARGO_BUILD_TARGET}"

      # scripts/ash_bench.py is the canonical perf tool; scripts/run_perf_matrix.py
      # is a shim that forwards here and exists only for out-of-tree callers.
      # See bench/README.md.
      #
      # Modes are pinned to interp + hybrid-eager, and the corpus to the two
      # cases this job has always run, so the numbers stay comparable with the
      # history in this workflow's artifacts. `hybrid-eager` is
      # --jit-threshold 1, the promotion policy the old script hardcoded.
      - name: Run perf smoke matrix
        run: |
          INCLUDE_SLOW="false"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            INCLUDE_SLOW="true"
          elif [[ "${{ github.event.inputs.include_slow || 'false' }}" == "true" ]]; then
            INCLUDE_SLOW="true"
          fi

          MIN_SPEEDUP="${{ github.event.inputs.min_speedup || '0' }}"

          BENCHES="tiered_hotloop,mandelbrot_small"
          SLOW_FLAG=()
          if [[ "$INCLUDE_SLOW" == "true" ]]; then
            BENCHES="tiered_hotloop,mandelbrot_small,mandelbrot"
            SLOW_FLAG=(--include-slow)
          fi

          ./scripts/ash_bench.py \
            --repo-root . \
            --build \
            --out-json target/perf/perf_smoke.json \
            --modes interp,hybrid-eager \
            --benchmarks "$BENCHES" \
            --iterations 5 \
            --warmups 1 \
            "${SLOW_FLAG[@]}" \
            --min-speedup "$MIN_SPEEDUP"

      - name: Upload perf smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-${{ github.run_id }}
          path: target/perf/perf_smoke.json
          if-no-files-found: error
          retention-days: 14
