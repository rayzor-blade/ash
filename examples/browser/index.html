<!doctype html>
<meta charset="utf-8">
<title>HashLink in WebAssembly</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    margin: 0 auto; padding: 3rem 1.5rem; max-width: 46rem;
  }
  h1 { font-size: 1.3rem; font-weight: 600; margin: 0 0 .3rem; }
  p.sub { margin: 0 0 2rem; opacity: .65; }
  #out {
    white-space: pre-wrap; margin: 0;
    border-left: 3px solid currentColor; padding: 1rem 1.2rem;
    min-height: 12rem; opacity: .95;
  }
  .err { color: #d33; }
  .meta { opacity: .55; }
</style>

<h1>Running HashLink in WebAssembly</h1>
<p class="sub">HashLink bytecode compiled to a WebAssembly module by ash, with a
  browser compatible runtime.</p>
<pre id="out"></pre>

<script type="module">
import init, { run } from "./ash_browser.js";

const out = document.getElementById("out");
const write = (text, cls) => {
  const line = document.createElement("span");
  if (cls) line.className = cls;
  line.textContent = text + "\n";
  out.appendChild(line);
};

// The host writes through console.log and console.error, which is where a
// page's output belongs and where a developer already looks. Mirroring it
// into the document as well means the program's output is visible without
// opening the developer tools.
for (const [name, cls] of [["log", ""], ["error", "err"]]) {
  const original = console[name].bind(console);
  console[name] = (...args) => {
    original(...args);
    write(args.join(" "), cls);
  };
}

try {
  await init();
  const response = await fetch("./demo.wasm");
  if (!response.ok) throw new Error(`fetching demo.wasm: ${response.status}`);
  const bytes = new Uint8Array(await response.arrayBuffer());
  write(`loaded demo.wasm, ${bytes.length.toLocaleString()} bytes`, "meta");
  write("", "meta");

  // Fetching is the page's business -- its origin, its caching, whether it
  // wants a stream -- so the host is handed bytes rather than a URL.
  const outcome = await run(bytes, ["demo.wasm"], []);
  write("");
  if (outcome.trapped) write(`trapped: ${outcome.trapped}`, "err");
  else write(`exited with ${outcome.status}`, "meta");
  document.title = outcome.trapped ? "HashLink in wasm — trapped" : "HashLink in wasm — done";
} catch (e) {
  write(String(e && e.message ? e.message : e), "err");
  document.title = "HashLink in wasm — failed";
}
</script>
