[package]
name = "ash_wasm_runtime"
version = "0.1.0"
edition = "2021"
description = "The wasm side of the ash runtime, and the hosts that complete it"
publish = false

[lib]
# A library and a binary, never a dynamic library. A cdylib would be linked
# as a DLL on Windows, and a DLL link demands every symbol be defined --
# which `ash_host_fiber_yield` never is, because it is a wasm import. Unix
# tolerates an undefined symbol in a shared object and MSVC does not, so this
# built everywhere except CI's windows job.
crate-type = ["rlib"]

[[bin]]
name = "ash-wasm-run"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
# Nothing extra: the guest side is plain Rust with no dependencies, which is
# what lets `ash_std` take it without dragging a host in.
guest = []
# Reading a module: what it is, and what it still needs. Light enough for the
# compiler to depend on -- one parser, no engine.
validate = ["dep:wasmparser"]
# The native host: wasmtime, for the conformance lane and for CI. No
# JavaScript anywhere in this path, and no wasm-bindgen.
native = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:anyhow", "dep:clap", "dep:tokio", "dep:libc", "validate"]
# The browser host: the same contract, reached through web-sys.
browser = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]

[dependencies]
wasmparser = { version = "0.245", optional = true }
wasmtime = { version = "43", optional = true }
wasmtime-wasi = { version = "43", optional = true }
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
tokio = { version = "1", features = ["rt", "macros"], optional = true }
# The native host answers the guest's socket imports with the operating
# system's sockets; on unix that is libc, and nowhere else is it anything.
libc = { version = "0.2", optional = true }

wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

[dependencies.web-sys]
version = "0.3"
optional = true
features = [
    "console",
    "Crypto",
    "Performance",
    "Window",
    "WorkerGlobalScope",
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "Event",
    "CloseEvent",
]
