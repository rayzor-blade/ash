name: test

# The crate's own unit tests. Nothing ran them before: `parity_gate` runs the
# parity INTEGRATION tests, and `lint` only compiles tests under clippy, so a
# `#[test]` in ash_std could fail forever without anyone noticing.
#
# The second job is the one that would have caught the bug this file was
# written for. A user reported `natives resolved, 1 missing: std@hlp_gc_stats`;
# it turned out to be 47 of HashLink's 313 primitives, and no unit test can see
# that class -- the VM resolves primitives BY NAME from the export table, so a
# missing or misspelled `#[no_mangle]` is a runtime failure in someone else's
# program, never a build error here.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    env:
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          # ash_std's build script runs bindgen, which shells out to
          # rustfmt. lint and parity_gate both ask for it for the same
          # reason.
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - name: Install LLVM 21 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gpg software-properties-common \
            libzstd-dev zlib1g-dev libxml2-dev libtinfo-dev libedit-dev libffi-dev
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all

      # ash_std first: its cdylib is embedded by the other crates' build
      # scripts, same ordering the lint job needs.
      - name: Build the embedded stdlib
        run: cargo build -p ash_std

      # Serialised on purpose. Tests that force a collection deadlock against
      # tests that register themselves as GC mutators: the collector's
      # stop-the-world waits for every registered mutator to park at a
      # safepoint, and a test thread sitting inside a prim never does. It hangs
      # roughly one run in seven, spinning every core until killed.
      - name: Test ash_std
        run: cargo test -p ash_std -- --test-threads=1

      - name: Test ash_core
        run: cargo test -p ash_core --lib

  primitive-exports:
    name: primitive export gap
    runs-on: ubuntu-24.04
    env:
      # ash_std pulls in no inkwell, but its build script runs bindgen, so it
      # needs a libclang matching the pinned bindgen release just as much as a
      # full build does.
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          # ash_std's build script runs bindgen, which shells out to
          # rustfmt. lint and parity_gate both ask for it for the same
          # reason.
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: exports

      - name: Install LLVM 21 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gpg software-properties-common \
            libzstd-dev zlib1g-dev libxml2-dev libtinfo-dev libedit-dev libffi-dev
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all

      # Source only. The comparison is against what HashLink DECLARES, so
      # nothing on this side needs building.
      - name: Fetch the HashLink primitive surface
        run: git clone --depth 1 https://github.com/HaxeFoundation/hashlink /tmp/hashlink

      - name: Build the embedded stdlib
        run: cargo build -p ash_std

      - name: Compare exports against DEFINE_PRIM
        run: ./scripts/check_primitive_exports.sh /tmp/hashlink

  hdll-callbacks:
    # The corpus links real shared libraries, resolves primitives by name from
    # an export table, and drives real collections -- every one of which the
    # platform decides. A macOS-only run said nothing about the Windows report
    # that started this work, and the first Linux run failed all 111 rows,
    # which a single-platform gate would never have shown.
    name: hdll callback corpus (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      HAXE_VERSION: "4.3.4"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt # bindgen pretty-prints through it

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: corpus-${{ matrix.os }}

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install LLVM 21 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gpg software-properties-common \
            libzstd-dev zlib1g-dev libxml2-dev libtinfo-dev libedit-dev libffi-dev
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib" >> "$GITHUB_ENV"

      - name: Install LLVM 21 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install zstd
          if brew install llvm@21 && [ -x "$(brew --prefix llvm@21)/bin/llvm-config" ]; then
            PREFIX="$(brew --prefix llvm@21)"
          else
            brew install llvm
            PREFIX="$(brew --prefix llvm)"
          fi
          "$PREFIX/bin/llvm-config" --version | grep -q '^21\.' \
            || { echo "::error::no LLVM 21 available from Homebrew"; exit 1; }
          echo "LLVM_SYS_211_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$PREFIX/lib" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - name: Cache LLVM 21 (Windows)
        if: runner.os == 'Windows'
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: C:\llvm21
          key: llvm-21.1.2-x86_64-pc-windows-msvc

      - name: Install LLVM 21 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Disables the rich progress bars that deadlock PowerShell in CI
          MAMBA_NO_PROGRESS: "true"
          CI: "true"
        run: |
          Write-Host "Downloading Micromamba..."
          curl.exe -fsSL -o micromamba.tar.bz2 `
            https://micro.mamba.pm/api/micromamba/win-64/latest
          
          Write-Host "Extracting Micromamba using 7-Zip..."
          # 7z extracts the .bz2 to a .tar, then un-tars it into the 'mm' directory
          7z x micromamba.tar.bz2 -y | Out-Null
          7z x micromamba.tar -omm -y | Out-Null
          
          $mm = Join-Path (Resolve-Path mm).Path 'Library\bin\micromamba.exe'
          Write-Host "Found micromamba at $mm"
          
          Write-Host "Creating environment (this may take a few minutes)..."
          # --log-level=info forces sequential text logs instead of UI spinners
          & $mm create -y -p "$PWD\llvmenv" -c conda-forge --log-level=info `
            "llvmdev=21.1.8" "zlib" "libxml2-devel"

          # In PowerShell, native executables failing don't inherently fail the step
          if ($LASTEXITCODE -ne 0) {
            throw "Micromamba failed with exit code $LASTEXITCODE"
          }

          $prefix = "$PWD\llvmenv\Library"
          if (-not (Test-Path "$prefix\bin\llvm-config.exe")) {
            throw "llvmdev installed no llvm-config.exe under $prefix\bin"
          }
          
          # Prove the reported paths point at THIS install, not the build box.
          $libdir = & "$prefix\bin\llvm-config.exe" --libdir
          Write-Host "llvm-config --libdir = $libdir"
          if (-not (Test-Path $libdir)) {
            throw "llvm-config reports a libdir that does not exist: $libdir"
          }
          & "$prefix\bin\llvm-config.exe" --version

          # llvm-config names its system libraries by the file names LLVM was
          # BUILT against, and conda-forge has since renamed zstd's import
          # library. Alias it rather than pinning an old zstd, so a version
          # bump cannot quietly take the link out again.
          if ((Test-Path "$libdir\zstd.lib") -and
              -not (Test-Path "$libdir\zstd.dll.lib")) {
            Copy-Item "$libdir\zstd.lib" "$libdir\zstd.dll.lib"
          }

          # Check every library the linker will be told to open, here rather
          # than ten minutes later at link time, where it surfaces as a bare
          # LNK1181 naming only the first one missing. The Windows SDK supplies
          # its own, so those are not this environment's to provide.
          $sdk = @('psapi.lib','shell32.lib','ole32.lib','uuid.lib',
                   'advapi32.lib','ws2_32.lib','ntdll.lib','kernel32.lib',
                   'user32.lib','userenv.lib','dbghelp.lib','delayimp.lib',
                   'legacy_stdio_definitions.lib')
          $missing = @()
          foreach ($lib in (& "$prefix\bin\llvm-config.exe" `
                              --system-libs --link-static).Split(' ')) {
            $lib = $lib.Trim()
            if (-not $lib -or $sdk -contains $lib.ToLower()) { continue }
            if (-not (Test-Path (Join-Path $libdir $lib))) { $missing += $lib }
          }
          if ($missing.Count) {
            throw "llvm-config names system libraries this env does not provide: $($missing -join ', ')"
          }
          Write-Host "all llvm-config --system-libs resolve under $libdir"
          "LLVM_SYS_211_PREFIX=$prefix" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build the runtime
        shell: bash
        run: |
          cargo build -p ash_std
          cargo build -p ash

      # A platform with no recorded baseline prints its matrix and passes: a
      # first run there is a measurement, not a verdict. It starts gating once
      # its expectations are committed.
      - name: Run the callback corpus
        shell: bash
        run: |
          # Git Bash on the Windows image ships `python`, not `python3`.
          command -v python3 >/dev/null && PY=python3 || PY=python
          "$PY" scripts/hdll_callbacks.py --timeout 60
