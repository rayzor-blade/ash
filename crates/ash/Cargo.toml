[package]
name = "ash_core"
version = "0.1.0"
edition = "2021"
authors = ["Damilare Akinlaja <dreakinlaja@gmail.com>"]
license = "MIT"
description = "ASH Virtual Machine for HashLink Bytecode"
keywords = ["Virtual Machine", "VM", "JIT", "Compiler", "Haxe", "HashLink"]

[dependencies]
inkwell = {workspace=true}
anyhow = {workspace=true}
flexstr = {workspace=true}
num_enum = {workspace=true}
hlbc = {git="https://github.com/Gui-Yom/hlbc", version = "0.8.0"}
libloading = "0.8.5"
once_cell = {workspace=true}
tempfile = "3.2"
memchr = "2.7.4"
byteorder = {workspace=true}
ash_macro = {workspace=true}
air = { path = "../air" }
libc = "0.2.158"
# Symbolizing the sampling profiler's frames: dladdr returns mangled names, and
# ash_std's are v0-mangled, which is not readable by inspection.
rustc-demangle = "0.1"
clap = { workspace = true }
beadie = { workspace = true }
cranelift-codegen = "0.130"
cranelift-frontend = "0.130"
cranelift-module = "0.130"

# NOTE: profiles live in the workspace root Cargo.toml. Cargo ignores a
# [profile.*] table in a non-root package and only warns about it, which is how
# this crate spent a while producing "release" builds that were nothing of the
# sort.

[package.metadata.bundle]

[build-dependencies]
bindgen = "0.70.1"

