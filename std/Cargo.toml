[package]
name = "ash_std"
version = "0.1.0"
edition = "2021"
authors = ["Damilare Akinlaja <dreakinlaja@gmail.com>"]
license = "MIT"
description = "Hashlink Std library for ASH"
keywords = ["Haxe", "HashLink"]

[dependencies]
flexstr = { workspace = true }
anyhow = { workspace = true }
libc = "0.2.158"
krio-fiber = { git = "https://github.com/darmie/krio" }
chrono = "0.4"
once_cell = "1.20.0"
regex = "1.11.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Globalization",
    "Win32_System_Environment",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
winapi = { version = "0.3", features = ["debugapi", "winnt"] }

[lib]
crate-type = ["cdylib", "rlib"]


[build-dependencies]
bindgen = "0.70.1"
