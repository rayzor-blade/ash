name: benchmarks

# Benchmark CI in two phases, deliberately.
#
# BUILD happens once, in its own job: the LLVM toolchain, ash itself, and both
# HashLink VMs. MEASUREMENT happens on fresh runners that download those
# artifacts and do nothing but run programs. Previously every one of the seven
# matrix legs compiled all of that itself and then measured on the same
# machine — roughly ten minutes of heavy compilation immediately before the
# numbers were taken, on a 4-core shared-tenant runner, seven times over. A
# benchmark that shares a runner with a build is measuring the build.
#
# Correctness is the gate, not speed: ash_bench.py and hl_bench.py both exit
# non-zero when a run prints a value outside the accepted checksum set, which
# fails that benchmark's leg. The aggregate publishes whatever legs survived.

on:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "std/**"
      - "bench/**"
      - "scripts/**"
      - "website/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/bench.yml"
  # Conformance runs on its own workflow and takes ~24 min against this
  # sweep's ~12, both starting from the same push. So at deploy time the only
  # SUCCESSFUL conformance run is always the PREVIOUS commit's, and the site
  # was published one commit behind for ever -- a +45-case improvement sat
  # unpublished because of exactly this. Rather than make the deploy sit and
  # wait for it, let conformance's completion trigger a republish of its own.
  # The heavy jobs below are skipped on that path; only deploy-site runs, and
  # it reuses the newest sweep's benchmark numbers.
  workflow_run:
    workflows: ["haxe-conformance"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-site pulls the newest conformance results across from the
  # haxe-conformance workflow; reading another workflow's artifacts needs this.
  actions: read

env:
  HASHLINK_VERSION: "1.15"
  # HashLink's active JIT-IR rewrite. Benched alongside the release so the
  # table shows both the stable reference and the moving target.
  HASHLINK_HL2_REF: "hl2_ir_rebase"

jobs:
  build:
    name: Build ash and the comparison VMs
    # A conformance-triggered run republishes the site only.
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
      # ash_std's build.rs runs bindgen; the runner's system libclang is too
      # old for the pinned bindgen and silently degrades structs to opaque.
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt # bindgen pretty-prints through it

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-build

      - name: Install LLVM 21 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gpg software-properties-common \
            libzstd-dev zlib1g-dev libxml2-dev libtinfo-dev libedit-dev libffi-dev
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all
          llvm-config-21 --version

      # Two invocations, not one: ash_std is a cdylib that ash's build.rs
      # embeds via include_bytes!, and cargo has no ordering edge between the
      # two — a single invocation can race and embed a stale or missing stdlib.
      - name: Build ash (release)
        run: |
          cargo build --release -p ash_std
          cargo build --release -p ash

      # HashLink is the page's 1.00 baseline. The VM needs only libhl + hl
      # (pcre is vendored); the hdll libraries with image/audio deps are not
      # built. Best-effort: a failure here costs that comparison row, never
      # the run, and hl_bench.py records the lane as UNAVAILABLE.
      - name: Cache HashLink ${{ env.HASHLINK_VERSION }}
        id: hl-cache
        uses: actions/cache@v4
        with:
          path: ~/hashlink
          key: hashlink-${{ env.HASHLINK_VERSION }}-ubuntu-24.04

      - name: Build HashLink ${{ env.HASHLINK_VERSION }}
        if: steps.hl-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          git clone --depth 1 --branch "${HASHLINK_VERSION}" \
            https://github.com/HaxeFoundation/hashlink.git ~/hashlink
          # A failed build must not be cached under the version key forever:
          # remove the tree so the cache post-step has nothing to save.
          make -C ~/hashlink libhl hl -j"$(nproc)" && test -x ~/hashlink/hl \
            || { echo "::warning::HashLink build failed"; rm -rf ~/hashlink; }

      # The branch moves, so the cache is keyed on the commit it currently
      # points at: unchanged branch means a hit and no rebuild, a moved
      # branch means a miss and a fresh build. Keying on anything
      # run-varying (a run number, a timestamp) misses every single time and
      # quietly rebuilds a HashLink on every leg, which is the cost this
      # split exists to remove.
      - name: Resolve ${{ env.HASHLINK_HL2_REF }} head
        id: hl2-rev
        run: |
          REV=$(git ls-remote https://github.com/HaxeFoundation/hashlink.git \
                  "refs/heads/${HASHLINK_HL2_REF}" | cut -f1)
          test -n "$REV" || REV=unresolved
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "$HASHLINK_HL2_REF is at $REV"

      - name: Cache HashLink ${{ env.HASHLINK_HL2_REF }}
        id: hl2-cache
        uses: actions/cache@v4
        with:
          path: ~/hashlink-hl2
          key: hashlink-hl2-ubuntu-24.04-${{ steps.hl2-rev.outputs.rev }}

      - name: Build HashLink ${{ env.HASHLINK_HL2_REF }}
        if: steps.hl2-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          rm -rf ~/hashlink-hl2
          git clone --depth 1 --branch "${HASHLINK_HL2_REF}" \
            https://github.com/HaxeFoundation/hashlink.git ~/hashlink-hl2
          # This branch has no phony `libhl`/`hl` targets — they are file
          # variables ($(LIBHL), $(HL)) reached through `all`. `LIBS=` drops
          # the optional hdlls, whose SDL3/openal headers the runner lacks.
          # (The branch also declares the VM x86_64-only, which this runner is.)
          if make -C ~/hashlink-hl2 LIBS= -j"$(nproc)" > /tmp/hl2build.log 2>&1 \
             && test -x ~/hashlink-hl2/hl; then
            ~/hashlink-hl2/hl --version
          else
            echo "::warning title=hl2-ir lane unavailable::build of ${HASHLINK_HL2_REF} failed; the benchmark table loses that row"
            tail -25 /tmp/hl2build.log
            # Leave nothing behind, or the cache post-step saves a broken
            # tree under this commit's key and every later run reuses it.
            rm -rf ~/hashlink-hl2
          fi

      # One archive, so a measuring runner unpacks rather than builds. tar
      # preserves the execute bits that the artifact format does not.
      - name: Package the toolchain
        run: |
          mkdir -p dist
          cp target/release/ash dist/
          cp target/release/libash_std.so dist/ 2>/dev/null || true
          tar czf dist/hashlink.tar.gz -C "$HOME" hashlink 2>/dev/null || echo "no hashlink"
          tar czf dist/hashlink-hl2.tar.gz -C "$HOME" hashlink-hl2 2>/dev/null || echo "no hl2"
          ls -la dist/
          # Prove the thing we are about to ship actually runs, here rather
          # than in seven downstream legs.
          ./target/release/ash --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: bench-toolchain
          path: dist/
          if-no-files-found: error
          retention-days: 7

  benchmark:
    name: bench (${{ matrix.bench }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      # One crashing benchmark must not cancel the rest of the sweep; the
      # aggregate below runs on whatever legs survive.
      fail-fast: false
      matrix:
        bench:
          - fib
          - binary_trees
          - deltablue
          - mandelbrot
          - nbody
          - inlined_call
          - method_call
          - free_call
          - closure_call
    steps:
      # Only what measurement needs: the .hl corpus, the bench scripts, and
      # the prebuilt binaries. No toolchain, no compiler, no cargo.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: bench-toolchain
          path: dist

      - name: Unpack the toolchain
        run: |
          mkdir -p target/release
          cp dist/ash target/release/ && chmod +x target/release/ash
          cp dist/libash_std.so target/release/ 2>/dev/null || true
          tar xzf dist/hashlink.tar.gz -C "$HOME" 2>/dev/null || true
          tar xzf dist/hashlink-hl2.tar.gz -C "$HOME" 2>/dev/null || true
          # The VM links libhl from beside itself.
          if [ -x "$HOME/hashlink/hl" ]; then
            echo "LD_LIBRARY_PATH=$HOME/hashlink${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
            "$HOME/hashlink/hl" --version
          else
            echo "::warning::hl binary not available; publishing without the HashLink baseline"
          fi
          ./target/release/ash --help > /dev/null

      # Haxe is needed only by the HL/C lane, which compiles each benchmark
      # from source. That lane runs after ash's numbers are taken, so its
      # compilation cannot disturb them.
      - uses: krdlab/setup-haxe@v1
        continue-on-error: true
        with:
          haxe-version: "4.3.4"

      # The Haxe compiler refuses the HL/C target without the hashlink
      # haxelib, even though the generated code only needs HashLink's C
      # headers (rayzor's CI learned this the same way).
      - name: Install hashlink haxelib
        continue-on-error: true
        run: haxelib install hashlink --always

      # `--jvm` writes JVM bytecode but is still the Java target, so it needs
      # that target's support library. Without it haxe fails the BUILD, which
      # would surface as a per-bench FAIL rather than an honest UNAVAILABLE
      # lane -- hl_bench checks for it, and this is what makes the check pass.
      - name: Install hxjava haxelib
        continue-on-error: true
        run: haxelib install hxjava --always

      # Pinned rather than left to whatever the image ships: the JVM row is
      # only comparable across runs if it is the same JVM. Best-effort like
      # the other comparison toolchains -- without it hl_bench records the
      # hxjvm lane UNAVAILABLE and the page renders without that row.
      - uses: actions/setup-java@v4
        continue-on-error: true
        with:
          distribution: temurin
          java-version: "21"

      - name: Bench ash (${{ matrix.bench }})
        run: |
          mkdir -p parts
          ./scripts/ash_bench.py \
            --benchmarks "${{ matrix.bench }}" \
            --modes hybrid-auto \
            --iterations 7 \
            --warmups 1 \
            --include-slow \
            --timeout-scale 3 \
            --ignore-load \
            --out-json "parts/ash-${{ matrix.bench }}.json"

      - name: Bench HashLink (JIT, hl2-ir, HL/C) and Haxe JVM (${{ matrix.bench }})
        run: |
          # An explicit `if`, not `test && assign`: under `bash -e` the
          # latter fails the whole step on the very case it is testing for.
          HL=()
          if [ -x "$HOME/hashlink/hl" ]; then
            HL=(--hl "$HOME/hashlink/hl")
          fi
          HL2=()
          if [ -x "$HOME/hashlink-hl2/hl" ]; then
            HL2=(--hl2 "$HOME/hashlink-hl2/hl")
          fi
          # --hl is passed explicitly because hl_bench falls back to
          # `shutil.which("hl")`, which finds whatever the Haxe toolchain put
          # on PATH rather than the VM this run just built. --hashlink-dir
          # only sets the library search path; it does not choose the binary.
          ./scripts/hl_bench.py \
            --benchmarks "${{ matrix.bench }}" \
            --hashlink-dir ~/hashlink \
            "${HL[@]}" \
            "${HL2[@]}" \
            --iterations 7 \
            --warmups 1 \
            --timeout-scale 3 \
            --out "parts/hl-${{ matrix.bench }}.json"

      # Which rungs the ladder actually climbed, read out of the timed runs
      # themselves — ash_bench already records every install. A leg that
      # silently never leaves the interpreter looks like a slow runner rather
      # than an unclimbed ladder, and fib's 342ms -> 74ms came entirely from
      # the top rung, so this is the first question to ask of a disappointing
      # number. Re-running the program under ASH_TIER_LOG would answer it too,
      # but from a run nobody timed.
      - name: Which tiers did the ladder reach? (${{ matrix.bench }})
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("parts/ash-${{ matrix.bench }}.json"))
          for r in d["results"]:
              t = r.get("tiered") or {}
              installs = r.get("tier_installs") or []
              print(f"{r['benchmark']} / {r['mode']}: "
                    f"cranelift={t.get('cranelift', 0)} llvm={t.get('llvm', 0)} "
                    f"attempted={t.get('attempted', 0)} failed={t.get('failed', 0)} "
                    f"fallbacks={t.get('fallbacks', 0)}")
              for i in installs:
                  print(f"    findex={i['findex']:<6} {i['tier']:<10} "
                        f"compile={i.get('compile_ms', 0):.2f}ms")
              # Reaching only Cranelift is not a fault in itself: the LLVM
              # chase is call-gated, and free_call's Cranelift code already
              # matches hand-written C, so it correctly stops there. Reaching
              # no tier at all means this leg timed the interpreter.
              if not installs:
                  print(f"::warning title=No tier installed ({r['benchmark']})::"
                        "the ladder never promoted anything; this leg measured "
                        "the interpreter, and its number should not be read as "
                        "a JIT result")
          PY

      - name: Report which comparison lanes this leg produced
        run: |
          # A lane whose VM is present but which still reports UNAVAILABLE is
          # a bug in this workflow, not a legitimately absent comparison, and
          # the difference is invisible on the published page — it just shows
          # one fewer bar. Fail the leg so it cannot publish quietly again.
          HAVE_HL=0
          HAVE_HL2=0
          if [ -x "$HOME/hashlink/hl" ]; then HAVE_HL=1; fi
          if [ -x "$HOME/hashlink-hl2/hl" ]; then HAVE_HL2=1; fi
          HAVE_HL=$HAVE_HL HAVE_HL2=$HAVE_HL2 python3 - <<'PY'
          import json, glob, os, sys
          present = {"hashlink-jit": os.environ["HAVE_HL"] == "1",
                     "hashlink-hl2": os.environ["HAVE_HL2"] == "1"}
          betrayed = []
          for f in sorted(glob.glob("parts/hl-*.json")):
              d = json.load(open(f))
              for r in d["results"]:
                  status, engine = r["status"], r["engine"]
                  mark = "ok " if status == "OK" else "MISSING"
                  print(f"{mark} {engine:<14} {r['benchmark']:<14} {status}"
                        f"{'' if status == 'OK' else '  — ' + r.get('detail','')[:80]}")
                  if status == "UNAVAILABLE" and present.get(engine):
                      betrayed.append(f"{engine}/{r['benchmark']}: {r.get('detail','')}")
          if betrayed:
              print("\n::error title=Comparison lane lost::a VM is installed on this "
                    "runner but its lane reported UNAVAILABLE:")
              for b in betrayed:
                  print(f"  {b}")
              sys.exit(1)
          PY

      - name: Upload partial result
        uses: actions/upload-artifact@v4
        with:
          name: bench-part-${{ matrix.bench }}
          path: parts/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Aggregate benchmark results
    needs: benchmark
    # `needs` alone would skip this whenever any matrix leg failed, and a
    # skipped aggregate skips the deploy — one crashing benchmark would take
    # the whole published page down rather than just its own rows.
    if: ${{ always() && github.event_name != 'workflow_run' && needs.benchmark.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download partials
        uses: actions/download-artifact@v4
        with:
          pattern: bench-part-*
          path: parts
          merge-multiple: true

      - name: Merge into site results.json
        run: |
          ls -la parts/ || true
          ./scripts/merge_bench_site.py --parts parts --out site-data/results.json --source ci
          python3 -m json.tool site-data/results.json > /dev/null

      - name: Upload merged results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: site-data/results.json
          if-no-files-found: error
          retention-days: 90

  deploy-site:
    name: Deploy website to GitHub Pages
    needs: aggregate
    # Only the deploy is serialised. Pages allows one deployment at a time,
    # and cancelling between upload-pages-artifact and deploy-pages would
    # throw away a finished sweep -- but the group has to sit on this job
    # alone. At workflow level it also serialises the sweeps, and since a
    # group holds at most one PENDING run, two pushes close together leave
    # the older one cancelled with no jobs at all: 202c68e never benched.
    concurrency:
      group: pages
      cancel-in-progress: false
    if: >-
      ${{ always() && (needs.aggregate.result == 'success' ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download merged results
        if: ${{ github.event_name != 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: site-data

      # Republishing for fresh conformance data must not re-run 12 minutes of
      # benchmarks, so reuse the newest completed sweep's numbers verbatim.
      - name: Reuse the newest benchmark results
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RID=$(gh run list --workflow=benchmarks --status=success \
                  --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RID" ]; then
            echo "::error::no successful benchmarks run to reuse"; exit 1
          fi
          mkdir -p site-data
          gh run download "$RID" -n benchmark-results -D site-data
          echo "benchmark numbers reused from run $RID"

      # Conformance is produced by a separate workflow on its own cadence, so
      # it is fetched rather than rebuilt here — one Pages deployment, two
      # sources. Best-effort: a missing artifact leaves the section saying so
      # rather than failing a deploy whose benchmark numbers are fine.
      - name: Fetch the latest conformance results
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGERING_RUN: ${{ github.event.workflow_run.id }}
        run: |
          # On a conformance-triggered republish this is the run that just
          # finished -- exactly the data this deploy exists to publish.
          RID="${TRIGGERING_RUN}"
          if [ -z "$RID" ]; then
            RID=$(gh run list --workflow=haxe-conformance --status=success \
                    --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          fi
          if [ -n "$RID" ]; then
            mkdir -p conf-data
            gh run download "$RID" -n conformance-results -D conf-data \
              && echo "conformance from run $RID" \
              || echo "::warning::conformance artifact could not be downloaded"
          else
            echo "::warning::no successful haxe-conformance run to publish yet"
          fi

      # The committed website/bench/results.json is a local-run fallback for
      # previews; the deploy always ships the fresh CI numbers over it.
      - name: Assemble site
        run: |
          mkdir -p website/bench
          cp site-data/results.json website/bench/results.json
          if [ -f conf-data/conformance.json ]; then
            cp conf-data/conformance.json website/bench/conformance.json
            python3 -m json.tool website/bench/conformance.json > /dev/null
            echo "published conformance results"
          else
            echo "no conformance results to publish this run"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
