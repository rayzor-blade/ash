[package]
name = "ash"
version = "0.1.0"
edition = "2021"
authors = ["Damilare Akinlaja <dreakinlaja@gmail.com>"]
license = "MIT"
description = "ASH HashLink VM CLI - hybrid interpreter/JIT runner"

[dependencies]
ash_core = { path = "../ash" }
ash_interp = { path = "../ash_interp" }
anyhow = { workspace = true }
inkwell = { workspace = true }
clap = { workspace = true }

# Both deps below serve only the unix crash-handler complex in main.rs
# (sigaction/SA_SIGINFO + the frame walk), which is #[cfg(unix)] as a unit;
# Windows runs without a crash handler for now (docs/windows-port.md).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Crash-handler frame names: dladdr returns v0-mangled Rust symbols, and a
# crash report you cannot read is half a crash report.
rustc-demangle = "0.1"

# glibc's allocator returns freed memory to the process lazily, which wren_lift
# measured as a large loss on Linux; jemalloc frees on time. Linux-only — macOS
# libmalloc does not have the problem.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.6"
