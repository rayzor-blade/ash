<!doctype html>
<!-- generated by ash; rewritten on every wasm build while this line is here -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__ASH_MODULE_TEXT__</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; }
  /* The log is for debugging (`?debug`); the browser's console is where a
     program's output belongs. Without it the canvas has the page. */
  body.debug { margin: 0 auto; padding: 2rem 1rem; max-width: 48rem; }
  #out { white-space: pre-wrap; border-left: 3px solid currentColor; padding: .8rem 1rem; min-height: 8rem; }
  #screen { display: block; width: 100%; height: auto; background: #0e0e12; }
  body.debug #screen { margin: 0 0 1rem; }
  .err { color: #d33; }
  .meta { opacity: .55; }
</style>
<canvas id="screen" width="640" height="360" hidden></canvas>
<pre id="out" hidden></pre>
<script type="module">
// The program runs in worker.js, never on this thread: a Haxe main loop does
// not return, and Atomics.wait is forbidden here.
const module = "./" + __ASH_MODULE_JSON__;
const out = document.getElementById("out");
// Kept in the document either way, so what the program wrote can still be read
// from its textContent.
const debug = new URLSearchParams(location.search).has("debug");
document.body.classList.toggle("debug", debug);
out.hidden = !debug;
const write = (text, cls) => {
  const line = document.createElement("span");
  if (cls) line.className = cls;
  line.textContent = text + "\n";
  out.appendChild(line);
};

if (!self.crossOriginIsolated) {
  write("Not cross-origin isolated: a threaded module has no shared memory here. Serve this directory with `ash serve`.", "meta");
}

// Made on the first frame a program presents. The canvas goes to its own
// agent, because the one running the program never returns to its event loop
// and a frame drawn there would not reach the page until the program ended.
let display = null;
// display.js takes the canvas for a program that presents a framebuffer. A
// plugin's shim may have taken it first (a GPU surface transfers it to its
// own Worker), and then there is nothing to give.
let screenTaken = false;
const takeScreen = () => {
  if (screenTaken) return null;
  screenTaken = true;
  const screen = document.getElementById("screen");
  try {
    const canvas = screen.transferControlToOffscreen();
    screen.hidden = false;
    // A framebuffer is low resolution: scale it up without smoothing. A GPU
    // surface that took the canvas first is drawn at its own size.
    screen.style.imageRendering = "pixelated";
    return canvas;
  } catch {
    return null;
  }
};
const describe = (e) => {
  if (e instanceof Error) return `${e.name}: ${e.message}`;
  if (e && typeof e.message === "string") return e.message;
  return String(e);
};
// Set once the page has its answer, "done" or a failure; the first one stands.
let ended = false;
// What a test runner reads, whatever the title says: `window.ashOutcome` and the `data-ash-status`
// attribute of the document element, set when the program exits or the page fails. `status` is the
// program's exit status, or -1 when the page failed before one existed; `trapped` is the reason, or
// null.
const publish = (status, trapped) => {
  window.ashOutcome = { status, trapped };
  document.documentElement.dataset.ashStatus = String(status);
};
// Ends the page as trapped when something the program waits on is gone: an
// agent that did not start or reported a failure, or the program's own worker.
// The program may be blocked on a reply that will never come, so it is
// stopped here. The text goes to the console too, which is where a runner
// reads it, and to the log, which is shown whatever `?debug` says.
const fail = (source, reason) => {
  if (ended) return;
  ended = true;
  const text = `${source}: ${describe(reason)}`;
  console.error(text);
  document.body.classList.add("debug");
  out.hidden = false;
  write(text, "err");
  worker.terminate();
  if (display) display.terminate();
  for (const agent of threadAgents) agent.terminate();
  publish(-1, text);
  document.title = `${module.slice(2)} — trapped`;
};
const worker = new Worker("./worker.js", { type: "module" });
worker.onmessage = ({ data }) => {
  if (data.kind === "done") {
    if (ended) return;
    ended = true;
    for (const agent of threadAgents) agent.terminate();
    publish(data.status, data.trapped ?? null);
    document.title = `${module.slice(2)} — ${data.trapped ? "trapped" : "done"}`;
    return;
  }
  // A library asked for something beside the program (`ash_host_agent`). Its
  // shim, <name>.mjs beside this page, is loaded here, on the page's thread,
  // and started with the program's memory, the address it named and the
  // canvas element. What it starts -- a Worker, DOM listeners -- is its own.
  // `fail(reason)` is for what it learns later, such as a command that threw
  // and has no reply to carry it; the program may be waiting on that reply.
  if (data.kind === "spawn-agent") {
    import(new URL(`./${data.name}.mjs`, location.href))
      .then((shim) => shim.start({
        memory: data.memory,
        address: data.address,
        canvas: document.getElementById("screen"),
        fail: (reason) => fail(`agent ${data.name}`, reason),
      }))
      .catch((e) => fail(`agent ${data.name} did not start`, e));
    return;
  }
  if (data.kind === "display") {
    if (!display) {
      const canvas = takeScreen();
      if (!canvas) return; // an agent that draws already has it
      display = new Worker("./display.js");
      display.postMessage({ canvas }, [canvas]);
    }
    display.postMessage(data);
    return;
  }
  write(data.text, data.kind === "err" ? "err" : data.kind === "meta" ? "meta" : "");
};
worker.onerror = (e) => fail("worker", e.message || "no reason given");

const query = new URLSearchParams(location.search);
// The agents Haxe threads run on, made here rather than in worker.js: some
// browsers (Chrome on Android) cannot start a Worker from inside a Worker.
// Each gets one end of a channel and worker.js the other, and threads are
// handed over it. One that fails to start is left out; the threads it would
// have run take turns on the main scheduler.
const threadAgents = [];
function startThreadAgents(count) {
  return Promise.all(Array.from({ length: count }, () => new Promise((settle) => {
    const agent = new Worker("./thread.js", { type: "module" });
    let started = false;
    agent.onmessage = ({ data }) => {
      if (data.kind === "agent") {
        if (data.state === "ready" && !started) {
          started = true;
          const channel = new MessageChannel();
          agent.postMessage({ port: channel.port2 }, [channel.port2]);
          threadAgents.push(agent);
          settle(channel.port1);
        }
        return;
      }
      write(data.text, data.kind === "err" ? "err" : data.kind === "meta" ? "meta" : "");
    };
    agent.onerror = (e) => {
      if (started) return write(`thread agent: ${e.message}`, "err");
      write(`thread agent did not start: ${e.message || "no reason given"}`, "meta");
      settle(null);
    };
  }))).then((ports) => ports.filter(Boolean));
}
const agentPorts = await startThreadAgents(Math.max(1, (navigator.hardwareConcurrency || 4) - 1));
worker.postMessage(
  { module, args: [module.slice(2), ...query.getAll("arg")], display: true, agents: agentPorts },
  agentPorts,
);
</script>
