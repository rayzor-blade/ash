[package]
name = "ash_core"
version = "0.1.0"
edition = "2021"
authors = ["Damilare Akinlaja <dreakinlaja@gmail.com>"]
license = "MIT"
description = "ASH Virtual Machine for HashLink Bytecode"
keywords = ["Virtual Machine", "VM", "JIT", "Compiler", "Haxe", "HashLink"]

[dependencies]
inkwell = {workspace=true}
ash_wasm_link = { path = "../ash_wasm_link" }
anyhow = {workspace=true}
flexstr = {workspace=true}
num_enum = {workspace=true}
libloading = "0.8.5"
# Linked in, not dlopened: build.rs generates a name -> address table over its
# #[no_mangle] exports so `std@` natives resolve with no dynamic loader at all.
# The archive still needs a reference per symbol to be pulled in, which is what
# that table provides.
ash_std = { path = "../../std" }
once_cell = {workspace=true}
tempfile = "3.2"
memchr = "2.7.4"
byteorder = {workspace=true}
ash_macro = {workspace=true}
air = { path = "../air" }
libc = "0.2.158"
# Symbolizing the sampling profiler's frames: dladdr returns mangled names, and
# ash_std's are v0-mangled, which is not readable by inspection.
rustc-demangle = "0.1"
clap = { workspace = true }
beadie = { workspace = true }
# Same wasmtime git rev as beadie-cranelift pins, so exactly ONE cranelift
# resolves into the graph. A crates.io copy alongside the git one compiles as
# a second, incompatible crate and none of beadie's cranelift types match.
cranelift-codegen  = { git = "https://github.com/bytecodealliance/wasmtime", rev = "bc2f967927f9f0e839095a752bf554c4a09fdd13" }
cranelift-frontend = { git = "https://github.com/bytecodealliance/wasmtime", rev = "bc2f967927f9f0e839095a752bf554c4a09fdd13" }
cranelift-module   = { git = "https://github.com/bytecodealliance/wasmtime", rev = "bc2f967927f9f0e839095a752bf554c4a09fdd13" }

# NOTE: profiles live in the workspace root Cargo.toml. Cargo ignores a
# [profile.*] table in a non-root package and only warns about it, which is how
# this crate spent a while producing "release" builds that were nothing of the
# sort.

[package.metadata.bundle]

[build-dependencies]
bindgen = "0.70.1"
cc = "1"

