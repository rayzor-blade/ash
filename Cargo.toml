[workspace]
resolver = "2"
members = [
  "crates/*",
  "std",
]
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] }

[workspace.dependencies]
anyhow = "1.0.91"
inkwell = { version = "0.8.0", features = ["llvm21-1-prefer-static"] }
beadie = { git = "https://github.com/darmie/beadie", features = ["cranelift"] }
flexstr = { version = "0.9" }
num_enum = {version = "0.7.3"}
ash_std ={ path = "std" }
ash_macro ={ path = "crates/ash_macro" }
once_cell = "1.20.2"
byteorder = "1.5.0"
clap = { version = "4", features = ["derive"] }


# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies but not for our code:
[profile.dev.package."*"]
opt-level = 3

# Profiles only take effect in the workspace root; cargo ignores a [profile.*]
# table in a member package and merely warns. This one lived in
# crates/ash/Cargo.toml and was silently discarded, so `--release` was building
# with default settings.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
debug = false
