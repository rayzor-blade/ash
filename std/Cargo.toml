[package]
name = "ash_std"
version = "0.1.0"
edition = "2021"
authors = ["Damilare Akinlaja <dreakinlaja@gmail.com>"]
license = "MIT"
description = "Hashlink Std library for ASH"
keywords = ["Haxe", "HashLink"]

[dependencies]
flexstr = { workspace = true }
anyhow = { workspace = true }
libc = "0.2.158"
chrono = "0.4"
once_cell = "1.20.0"
fancy-regex = "0.18.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Globalization",
    "Win32_System_Environment",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
winapi = { version = "0.3", features = ["debugapi", "winnt"] }

[lib]
# `staticlib` for AOT: the emitted object links the runtime in rather
# than dlopen-ing a cdylib, which wasm cannot do at all and which for
# native AOT would only relocate the C-wrapper problem into a dylib.
crate-type = ["cdylib", "rlib", "staticlib"]


[build-dependencies]
bindgen = "0.70.1"
cc = "1"

# Native fiber stack switching. A wasm module cannot switch stacks itself --
# there a fiber is driven by the host -- so the dependency is native-only and
# `fiber.rs` gates on the same condition.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
krio-fiber = { git = "https://github.com/darmie/krio" }

# The wasm side of the runtime, linked in rather than imported: see that
# crate's docs for why only fiber suspension crosses the module boundary.
[target.'cfg(target_family = "wasm")'.dependencies]
ash_wasm_runtime = { path = "../crates/ash_wasm_runtime", default-features = false, features = ["guest"] }
