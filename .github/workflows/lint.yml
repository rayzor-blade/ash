name: lint

# Clippy across the whole workspace and every target, warnings denied.
# The build scripts run under clippy, so the job needs the same LLVM 21 /
# libclang environment as a real build.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    runs-on: ubuntu-24.04
    env:
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - uses: ./.github/actions/llvm21

      # ash_std first: its cdylib is embedded by the other crates' build
      # scripts, which also run under clippy.
      - name: Clippy
        run: |
          cargo build -p ash_std
          cargo clippy --workspace --all-targets -- -D warnings

  # The host job above compiles none of the wasm code: `browser` is gated on
  # a wasm target family and half of ash_std is behind `cfg(target_family)`,
  # so a lint that only fires there goes unseen. It does fire -- gating the
  # HDLL search to the targets that can dlopen left two functions dead on
  # wasm, and neither showed up on the host.
  clippy-wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
          targets: wasm32-wasip1, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint-wasm

      - name: Cache the WASI sysroot
        id: wasi-cache
        uses: actions/cache@v4
        with:
          path: ~/wasi-sysroot
          key: wasi-sdk-25-sysroot-v1

      - name: Fetch the WASI sysroot
        if: steps.wasi-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o /tmp/wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
          mkdir -p /tmp/wasi-sdk && tar -xzf /tmp/wasi-sdk.tar.gz -C /tmp/wasi-sdk --strip-components=1
          mv /tmp/wasi-sdk/share/wasi-sysroot ~/wasi-sysroot
          ls ~/wasi-sysroot/lib/wasm32-wasip1/libsetjmp.a

      # ash_std's build script runs bindgen against these headers, and a C
      # dependency needs the same sysroot and -fPIC, since a library is
      # position-independent by definition.
      - name: Clippy for wasm
        env:
          WASI_SYSROOT: /home/runner/wasi-sysroot
          CC_wasm32_wasip1: clang
          CFLAGS_wasm32_wasip1: --target=wasm32-wasi --sysroot=/home/runner/wasi-sysroot -fPIC
        run: |
          cargo clippy -p ash_std --target wasm32-wasip1 -- -D warnings
          cargo clippy -p ash_hdll_sqlite --target wasm32-wasip1 -- -D warnings
          cargo clippy -p ash_wasm_runtime --no-default-features --features guest \
            --target wasm32-wasip1 -- -D warnings
          cargo clippy -p ash_wasm_runtime --no-default-features --features browser \
            --target wasm32-unknown-unknown -- -D warnings

  # Compile and link the full CLI against real Windows headers on every push.
  # Checking ash_std alone missed ash_interp's MSVC enum width and Unix API
  # regressions; cargo check would also miss unavailable CRT symbols at link
  # time. Use the same LLVM SDK as the release job so this is the release
  # build's Windows gate rather than a weaker approximation of it.
  windows-check:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt # bindgen pretty-prints through it

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-check

      - uses: ./.github/actions/llvm21

      - name: Build
        shell: bash
        run: |
          cargo build --release -p ash_std
          cargo build --release -p ash

      - uses: ./.github/actions/llvm21-runtime-dlls
        with:
          into: target\release\

      - name: Smoke test interpreter
        shell: bash
        run: |
          # Bundle the diagnostic / HashLink runtime
          if [ -f "target/release/ash_std.dll" ]; then
            echo "Bundling ash_std.dll and creating libhl aliases..."
            # *.dll above already copied ash_std.dll, but we need the HashLink names:
            
            # Keep a compatibility-named copy beside ash for native extensions
            cp target/release/ash_std.dll target/release/libhl.dll
            
            # HashLink 1.x CMake builds import libhl.1.dll. 
            # We copy instead of symlink because Windows symlinks can require 
            # Admin rights/Developer Mode and break user extraction.
            cp target/release/ash_std.dll target/release/libhl.1.dll
          else
            echo "::warning::ash_std.dll not found; installed ash will extract its runtime on every run"
          fi
          ./target/release/ash.exe --mode interp crates/ash/test/tests/test_basic.hl
