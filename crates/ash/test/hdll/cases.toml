# The HDLL callback corpus.
#
# Every case is a Haxe program that hands a closure to a C library, lets the
# collector run, and then has the LIBRARY call it back through hl_dyn_call.
# That is the shape ash got wrong twice -- once in hl_dyn_call's ABI and once
# in hl_add_root's contract -- and neither defect is reachable from a Rust
# unit test, because both live on the boundary a real hdll crosses.
#
# `roots` selects the CBn_ROOT switch each harness reads:
#   none    the library keeps a bare vclosure* in malloc'd memory and declares
#           nothing. Whether this survives is not contractual -- a 32-byte
#           closure often lands in a block sweep happens to retain -- so these
#           rows are recorded, not required.
#   slot    hl_add_root(&stash->cb), the spelling upstream documents and every
#           real hdll uses. These rows are the contract.
#   object  hl_add_root(stash->cb). Upstream has no such form; ash accepted it
#           until the root path was made unconditional, so these rows exist to
#           pin down what it does now rather than to demand anything.
#
# Run with scripts/hdll_callbacks.py; see that file for how a row is judged.

[[case]]
name = "cb0"
class = "Cb0"
lib = "cb0"
env_prefix = "CB0"   # the CBn_* switches this library reads
purpose = "control: static fn taking one Int, stored in malloc'd memory, invoked after churn"
roots = ["none", "slot", "object"]

[[case]]
name = "cb0b"
class = "Cb0b"
lib = "cb0"
env_prefix = "CB0"   # the CBn_* switches this library reads
purpose = "as cb0, but handed over from a helper frame that returns, so no live Haxe register holds it"
roots = ["none", "slot", "object"]

