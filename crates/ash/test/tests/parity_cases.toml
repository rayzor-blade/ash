[[case]]
# Arithmetic where an operand is Dynamic, i.e. std@hlp_dyn_op — which ash did
# not implement at all, so the official Haxe unit suite could not even start.
# Pins the trap: the arithmetic operators yield a Float even for two boxed
# Ints, the shifts and bitwise operators yield an Int.
name = "TestDynOp"
main = "TestDynOp"
hl = "test_dyn_op.hl"
slow = false
timeout_secs = 60
expectation = "exact"
normalize = "default"

[[case]]
# Array<String>.sort through ArrayObj's `cast this` — the OSafeCast-
# reinterpret defect's fixture, registered the day the fix landed. Guards
# all three lowering sites at once, since sorting requires the ArrayDyn
# wrapper to actually exist.
name = "TestArrayObjSort"
main = "TestArrayObjSort"
hl = "test_arrayobj_sort.hl"
slow = false
timeout_secs = 60
expectation = "exact"
normalize = "default"

[[case]]
# Map families x iterator forms, order-independent sums. Gates all three
# modes. This was the fixture for the whole-module JIT's Int-values
# mis-unbox (CallMethod's HVIRTUAL fallback called the implementation
# through the interface's declared ABI, reading the low 32 bits of a
# returned box pointer as the value); fixed by boxing through
# hlp_vcall_dyn, and this case is the regression net.
name = "TestMapIterAll"
main = "TestMapIterAll"
hl = "test_map_iter_all.hl"
slow = false
timeout_secs = 60
expectation = "exact"
normalize = "default"

[[case]]
# Sys.args(): the CLI used to reject the program's own arguments outright,
