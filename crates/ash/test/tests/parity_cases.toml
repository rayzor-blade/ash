# The two Mandelbrots pin hybrid runs to the Cranelift tier. Their checksums
# accumulate contractible mul+add chains, and the AIR fma peephole fuses those
# in the LLVM tier -- legally, but into a different number than the oracle's
# op-by-op rounding, and WHICH number depends on how many pixels ran before
# promotion landed. Cranelift re-serializes Fma as mul+add by design, so the
# pinned run still promotes and still matches the oracle bit for bit. If
# fusion ever becomes construction-wide (every engine, interpreter included),
# these pins and the oracle comparison move together.
[[case]]
name = "MandelbrotSmall"
main = "MandelbrotSmall"
hl = "test_mandelbrot_small.hl"
slow = false
timeout_secs = 120
expectation = "checksum"
normalize = "default"
jit_tier = "cranelift"

[[case]]
name = "Mandelbrot"
main = "Mandelbrot"
hl = "test_mandelbrot.hl"
slow = true
timeout_secs = 600
expectation = "checksum"
normalize = "default"
jit_tier = "cranelift"

