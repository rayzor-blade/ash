[workspace]
resolver = "2"
members = [
  "crates/*",
  "std",
]
[workspace.dependencies]
anyhow = "1.0.91"
inkwell = { version = "0.8.0", features = ["llvm21-1-prefer-static"] }
beadie = { git = "https://github.com/darmie/beadie", features = ["cranelift"] }
flexstr = { version = "0.9" }
num_enum = {version = "0.7.3"}
ash_std ={ path = "std" }
ash_macro ={ path = "crates/ash_macro" }
once_cell = "1.20.2"
byteorder = "1.5.0"
clap = { version = "4", features = ["derive"] }


# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies but not for our code:
[profile.dev.package."*"]
opt-level = 3