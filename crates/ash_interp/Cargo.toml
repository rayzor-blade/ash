[package]
name = "ash_interp"
version = "0.1.0"
edition = "2021"
authors = ["Damilare Akinlaja <dreakinlaja@gmail.com>"]
license = "MIT"
description = "HashLink bytecode interpreter for ASH VM"

[dependencies]
ash_core = { path = "../ash" }
air = { path = "../air" }
anyhow = { workspace = true }
inkwell = { workspace = true }
beadie = { workspace = true }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Diagnostics_Debug"] }

[build-dependencies]
cc = "1"
