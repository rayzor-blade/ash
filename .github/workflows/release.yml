name: release

# Prebuilt binaries for the install.sh path. A pushed v* tag publishes a
# versioned release; the nightly schedule and a manual dispatch both rebuild
# the rolling `nightly` release (kept marked latest so
# `releases/latest/download/...` always resolves).
# One self-contained tarball per platform: the binary embeds ash_std and
# links LLVM statically, and simd.hdll serves stock HashLink programs. On
# macOS the few remaining Homebrew dylibs are bundled beside them (see
# scripts/package_release.sh).

on:
  push:
    tags:
      - "v*"
  # 02:00 UTC, which leaves the ~90 minutes a three-platform build can take
  # clear of the benchmark sweep at 04:17 and the gates after it.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # What `ash --build x.wasm` links against. It is wasm, so the same for every
  # platform: built once here and packaged beside every binary, where ash looks
  # for it. (The browser host the page loads is built into ash by ash_page.)
  wasm-assets:
    name: build (wasm runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, rust-src
          targets: wasm32-wasip1, wasm32-wasip1-threads, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-wasm-assets

      # ash_std's build runs bindgen, which needs libclang.
      - uses: ./.github/actions/llvm21

      - name: Cache the WASI sysroot
        id: wasi-cache
        uses: actions/cache@v4
        with:
          path: ~/wasi-sysroot
          key: wasi-sdk-25-sysroot-v1

      - name: Fetch the WASI sysroot
        if: steps.wasi-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o /tmp/wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
          mkdir -p /tmp/wasi-sdk && tar -xzf /tmp/wasi-sdk.tar.gz -C /tmp/wasi-sdk --strip-components=1
          mv /tmp/wasi-sdk/share/wasi-sysroot ~/wasi-sysroot
          ls ~/wasi-sysroot/lib/wasm32-wasip1/libsetjmp.a

      - name: Build the runtime objects
        run: |
          ./scripts/build_wasm_runtime.py --sysroot ~/wasi-sysroot
          ./scripts/build_wasm_runtime.py --sysroot ~/wasi-sysroot --target wasm32-wasip1-threads

      - name: Stage
        run: |
          for triple in wasm32-wasip1 wasm32-wasip1-threads; do
            mkdir -p "wasm-assets/$triple"
            cp "target/release/$triple/ash_runtime.o" "wasm-assets/$triple/"
          done
          find wasm-assets -type f -exec ls -la {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-assets
          path: wasm-assets
          if-no-files-found: error

  build:
    name: build (${{ matrix.target }})
    needs: wasm-assets
    runs-on: ${{ matrix.os }}
    # A retired or saturated runner image must fail this leg, not stall the
    # release behind it.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          # The native aarch64 Linux runner; the same apt.llvm.org script
          # serves arm64.
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-14
            target: macos-aarch64
          # macos-13 is retired: its jobs queue forever rather than failing,
          # which used to hold the whole release. macos-15-intel is the
          # current Intel image.
          - os: macos-15-intel
            target: macos-x86_64
          # The -dev tarballs register every LLVM backend, for `--target`
          # triples outside the supported set (MIPS, LoongArch, SPARC, ...).
          # Objects only, like the rest of the cross-target set: nothing
          # links or runs them here.
          - os: ubuntu-24.04
            target: linux-x86_64-dev
            features: all-targets
          - os: macos-14
            target: macos-aarch64-dev
            features: all-targets
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt # bindgen pretty-prints through it

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install LLVM 21 (Linux)
        if: runner.os == 'Linux'
        run: |
          # ash installs nothing from the runner image's Microsoft source, and
          # when that repository fails (403) the update fails the job.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update
          sudo apt-get install -y wget gpg software-properties-common \
            libzstd-dev zlib1g-dev libxml2-dev libtinfo-dev libedit-dev libffi-dev
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib" >> "$GITHUB_ENV"

      - name: Install LLVM 21 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install zstd
          # The unversioned formula tracks Homebrew's current LLVM, which is
          # not necessarily 21; prefer the pinned bottle and fall back.
          if brew install llvm@21 && [ -x "$(brew --prefix llvm@21)/bin/llvm-config" ]; then
            PREFIX="$(brew --prefix llvm@21)"
          else
            brew install llvm
            PREFIX="$(brew --prefix llvm)"
          fi
          "$PREFIX/bin/llvm-config" --version
          "$PREFIX/bin/llvm-config" --version | grep -q '^21\.' \
            || { echo "::error::no LLVM 21 available from Homebrew"; exit 1; }
          echo "LLVM_SYS_211_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$PREFIX/lib" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      # Two invocations, not one: ash_std is a cdylib the runtime crates
      # embed via include_bytes! at build time, and cargo has no ordering
      # edge between the packages.
      - name: Build ash (release)
        run: |
          cargo build --release -p ash_std
          cargo build --release -p ash ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
          cargo build --release -p ash_hdll_simd
          cargo build --release -p ash_hdll_future

      - name: Smoke test
        run: |
          ./target/release/ash --mode interp crates/ash/test/tests/test_basic.hl
          ./target/release/ash --mode hybrid crates/ash/test/tests/test_basic.hl

      - name: Fetch the wasm runtime
        uses: actions/download-artifact@v4
        with:
          name: wasm-assets
          path: wasm-assets

      - name: Package
        run: |
          ./scripts/package_release.sh "${{ matrix.target }}" wasm-assets
          if [[ "$(uname -s)" == "Darwin" ]]; then
            cp target/release/libash_hdll_future.dylib "dist/ash_future-${{ matrix.target }}.hdll"
            install_name_tool -id "@loader_path/ash_future.hdll" "dist/ash_future-${{ matrix.target }}.hdll"
            codesign --force -s - "dist/ash_future-${{ matrix.target }}.hdll"
          else
            cp target/release/libash_hdll_future.so "dist/ash_future-${{ matrix.target }}.hdll"
          fi

      - name: Smoke test the packaged binary
        run: |
          tar xzf "dist/ash-${{ matrix.target }}.tar.gz" -C "$RUNNER_TEMP"
          test -s "$RUNNER_TEMP/simd.hdll"
          "$RUNNER_TEMP/ash" --mode interp crates/ash/test/tests/test_basic.hl
          "$RUNNER_TEMP/ash" --version
          # The installed layout, end to end: build a module from the
          # packaged runtime, run it, and check the page was written.
          mkdir -p "$RUNNER_TEMP/web"
          "$RUNNER_TEMP/ash" --build "$RUNNER_TEMP/web/basic.wasm" --target wasm32-wasip1 \
            crates/ash/test/tests/test_basic.hl
          "$RUNNER_TEMP/ash" run "$RUNNER_TEMP/web/basic.wasm"
          test -s "$RUNNER_TEMP/web/index.html" && test -s "$RUNNER_TEMP/web/ash_browser_bg.wasm"

      # What the -dev tarball exists for: an object for a triple the default
      # build refuses.
      - name: Emit an object for an unsupported target
        if: matrix.features == 'all-targets'
        run: |
          "$RUNNER_TEMP/ash" --emit-aot "$RUNNER_TEMP/basic-mips.o" --target mips64el-unknown-linux-gnuabi64 \
            crates/ash/test/tests/test_basic.hl
          test -s "$RUNNER_TEMP/basic-mips.o"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ash-${{ matrix.target }}
          path: |
            dist/ash-${{ matrix.target }}.tar.gz
            dist/simd-${{ matrix.target }}.hdll
            dist/ash_future-${{ matrix.target }}.hdll
          if-no-files-found: error

  # Its own job rather than a matrix leg: the runner has no LLVM development
  # files, so this one installs them before it can build at all.
  windows:
    name: build (${{ matrix.target }})
    needs: wasm-assets
    runs-on: windows-2022
    # Same budget as the matrix: a stalled runner must fail this leg rather
    # than hold the release behind it.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
          # Every LLVM backend, like the other -dev tarballs.
          - target: windows-x86_64-dev
            features: all-targets
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}-release


      # The development files LLVM.org's Windows installer leaves out.
      # INSTALLED, not unzipped: a conda package carries its build-time prefix
      # (`C:/bld/llvm-package_*/work/build`) inside llvm-config.exe, and conda
      # rewrites that on install. Unpacking the tarball by hand skips the
      # rewrite, so llvm-config reports a libdir that does not exist and the
      # link fails with the archives sitting right there.
      - name: Install LLVM 21 (Windows)
        shell: pwsh
        env:
          # Disables the rich progress bars that deadlock PowerShell in CI
          MAMBA_NO_PROGRESS: "true"
          CI: "true"
        run: |
          Write-Host "Downloading Micromamba..."
          curl.exe -fsSL -o micromamba.tar.bz2 `
            https://micro.mamba.pm/api/micromamba/win-64/latest
          
          Write-Host "Extracting Micromamba using 7-Zip..."
          # 7z extracts the .bz2 to a .tar, then un-tars it into the 'mm' directory
          7z x micromamba.tar.bz2 -y | Out-Null
          7z x micromamba.tar -omm -y | Out-Null
          
          $mm = Join-Path (Resolve-Path mm).Path 'Library\bin\micromamba.exe'
          Write-Host "Found micromamba at $mm"
          
          Write-Host "Creating environment (this may take a few minutes)..."
          # --log-level=info forces sequential text logs instead of UI spinners
          & $mm create -y -p "$PWD\llvmenv" -c conda-forge --log-level=info `
            "llvmdev=21.1.8" "zlib" "libxml2-devel"

          # In PowerShell, native executables failing don't inherently fail the step
          if ($LASTEXITCODE -ne 0) {
            throw "Micromamba failed with exit code $LASTEXITCODE"
          }

          $prefix = "$PWD\llvmenv\Library"
          if (-not (Test-Path "$prefix\bin\llvm-config.exe")) {
            throw "llvmdev installed no llvm-config.exe under $prefix\bin"
          }
          
          # Prove the reported paths point at THIS install, not the build box.
          $libdir = & "$prefix\bin\llvm-config.exe" --libdir
          Write-Host "llvm-config --libdir = $libdir"
          if (-not (Test-Path $libdir)) {
            throw "llvm-config reports a libdir that does not exist: $libdir"
          }
          & "$prefix\bin\llvm-config.exe" --version

          # llvm-config names its system libraries by the file names LLVM was
          # BUILT against, and conda-forge has since renamed zstd's import
          # library. Alias it rather than pinning an old zstd, so a version
          # bump cannot quietly take the link out again.
          if ((Test-Path "$libdir\zstd.lib") -and
              -not (Test-Path "$libdir\zstd.dll.lib")) {
            Copy-Item "$libdir\zstd.lib" "$libdir\zstd.dll.lib"
          }

          # Check every library the linker will be told to open, here rather
          # than ten minutes later at link time, where it surfaces as a bare
          # LNK1181 naming only the first one missing. The Windows SDK supplies
          # its own, so those are not this environment's to provide.
          $sdk = @('psapi.lib','shell32.lib','ole32.lib','uuid.lib',
                   'advapi32.lib','ws2_32.lib','ntdll.lib','kernel32.lib',
                   'user32.lib','userenv.lib','dbghelp.lib','delayimp.lib',
                   'legacy_stdio_definitions.lib')
          $missing = @()
          foreach ($lib in (& "$prefix\bin\llvm-config.exe" `
                              --system-libs --link-static).Split(' ')) {
            $lib = $lib.Trim()
            if (-not $lib -or $sdk -contains $lib.ToLower()) { continue }
            if (-not (Test-Path (Join-Path $libdir $lib))) { $missing += $lib }
          }
          if ($missing.Count) {
            throw "llvm-config names system libraries this env does not provide: $($missing -join ', ')"
          }
          Write-Host "all llvm-config --system-libs resolve under $libdir"
          "LLVM_SYS_211_PREFIX=$prefix" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build
        shell: bash
        run: |
          cargo build --release -p ash_std
          cargo build --release -p ash ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
          cargo build --release -p ash_hdll_simd
          cargo build --release -p ash_hdll_future

      # LLVM pulls zlib, zstd and libxml2 in through IMPORT libraries, so those
      # DLLs have to sit beside the exe: Windows searches the executable's own
      # directory first, and without them the process cannot start at all --
      # which surfaces as a bare exit 127 with no output, not a missing-DLL
      # message. Copying them here also makes the published archive standalone
      # rather than dependent on a conda env being on PATH.
      - name: Bundle the runtime DLLs the binary links against (Windows)
        shell: pwsh
        run: |
          $envBin = "$PWD\llvmenv\Library\bin"
          $needed = @('zlib.dll', 'zstd.dll', 'libxml2.dll')
          $missing = @()
          foreach ($dll in $needed) {
            $src = Join-Path $envBin $dll
            if (Test-Path $src) {
              Copy-Item $src target\release\ -Force
              Write-Host "bundled $dll"
            } else {
              $missing += $dll
            }
          }
          if ($missing.Count) {
            Write-Host "--- $envBin ---"
            Get-ChildItem $envBin -Filter *.dll | ForEach-Object { Write-Host "  $($_.Name)" }
            throw "the env provides no $($missing -join ', ') to sit beside the binary"
          }

      - name: Fetch the wasm runtime
        uses: actions/download-artifact@v4
        with:
          name: wasm-assets
          path: wasm-assets

      - name: Package (windows)
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/ash.exe dist/
          cp -R wasm-assets/. dist/
          test -s target/release/ash_hdll_simd.dll
          cp target/release/ash_hdll_simd.dll dist/simd.hdll
          
          # Copy the Conda/LLVM runtime DLLs bundled in the previous step
          cp target/release/*.dll dist/
          rm -f dist/ash_hdll_simd.dll
          rm -f dist/ash_hdll_future.dll
          
          # crates/ash_cli/build.rs stages ash_std.dll under the names an
          # hdll's import table asks for, so the `*.dll` copy above already
          # carries them. Check rather than repeat it: without libhl.dll the
          # binary still starts and then fails on the first HDLL, which is a
          # bad way to find out. (Copies, not symlinks -- a Windows symlink
          # needs Developer Mode or admin rights to create.)
          for name in libhl.dll libhl.1.dll; do
            if [ ! -f "dist/$name" ]; then
              echo "::error::build.rs staged no $name; hdlls would bind a runtime that is not there"
              exit 1
            fi
          done
          
          # Compress inside the dist directory
          cd dist
          tar -czf ash-${{ matrix.target }}.tar.gz ash.exe simd.hdll *.dll wasm32-wasip1 wasm32-wasip1-threads
          cp simd.hdll simd-${{ matrix.target }}.hdll
          cp ../target/release/ash_hdll_future.dll ash_future-${{ matrix.target }}.hdll
          lib.exe /def:../crates/ash_hdll_future/ash_future.def /machine:x64 /out:ash_future-${{ matrix.target }}.lib

          # Generate SHA256
          sha256sum ash-${{ matrix.target }}.tar.gz > ash-${{ matrix.target }}.tar.gz.sha256
          cd ..

      - name: Upload artifact (windows)
        uses: actions/upload-artifact@v4
        with:
          name: ash-${{ matrix.target }}
          path: |
            dist/ash-${{ matrix.target }}.tar.gz
            dist/simd-${{ matrix.target }}.hdll
            dist/ash_future-${{ matrix.target }}.hdll
            dist/ash_future-${{ matrix.target }}.lib
          if-no-files-found: error        

  publish:
    name: Publish release
    needs: [wasm-assets, build, windows]

    # `always()` so one platform failing still publishes the others -- the
    # "at least one tarball" step below is what makes an empty release an
    # error. A cancelled run publishes nothing.
    if: ${{ always() && needs.build.result != 'cancelled' && needs.windows.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ash-*
          path: dist
          merge-multiple: true

      # haxelib.json has no install hook. Put every native HDLL in the ZIP so
      # `haxelib install` extracts them with the Haxe sources; extraParams.hxml
      # stages the host copy beside generated HashLink bytecode.
      - name: Package ash-simd for Haxelib
        run: |
          if python3 scripts/package_ash_simd_haxelib.py dist --check; then
            python3 scripts/package_ash_simd_haxelib.py dist
          else
            echo "::warning::incomplete platform build; no ash-simd haxelib ZIP"
          fi

      - name: Package ash-future for Haxelib
        run: |
          if python3 scripts/package_ash_future_haxelib.py dist --check; then
            python3 scripts/package_ash_future_haxelib.py dist
          else
            echo "::warning::incomplete platform build; no ash-future haxelib ZIP"
          fi

      - name: Require at least one tarball
        run: |
          ls -la dist/ || true
          count=$(find dist -name '*.tar.gz' | wc -l | tr -d ' ')
          if [ "$count" = "0" ]; then
            echo "::error::no platform produced a tarball; nothing to publish"
            exit 1
          fi
          echo "publishing $count tarball(s):"
          find dist -name '*.tar.gz' -exec basename {} \;

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.hdll
            dist/*.lib
            dist/*.zip
          make_latest: true

      - name: Publish rolling nightly
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: nightly
          body: >
            Rolling build of main. Prebuilt `ash` binaries for the
            install.sh path and native SIMD and Future HDLLs for stock HashLink;
            superseded by the next versioned release.
          files: |
            dist/*.tar.gz
            dist/*.hdll
            dist/*.lib
            dist/*.zip
          prerelease: false
          make_latest: true
