[[case]]
# Arithmetic where an operand is Dynamic, i.e. std@hlp_dyn_op — which ash did
# not implement at all, so the official Haxe unit suite could not even start.
# Pins the trap: the arithmetic operators yield a Float even for two boxed
# Ints, the shifts and bitwise operators yield an Int.
name = "TestDynOp"
main = "TestDynOp"
hl = "test_dyn_op.hl"
slow = false
timeout_secs = 60
expectation = "exact"
normalize = "default"

[[case]]
# Sys.args(): the CLI used to reject the program's own arguments outright,
# and the runtime's hlp_sys_init had no caller. Args here include a
# hyphenated one, which is the form that clap ate.
name = "TestSysArgs"
main = "TestSysArgs"
hl = "test_sys_args.hl"
program_args = ["alpha", "beta", "--gamma=1"]
slow = false
timeout_secs = 60
expectation = "exact"
normalize = "default"

[[case]]
# Relational comparison between strings. `<` and `>` on HOBJ (String)
# operands fell through to a pointer comparison that has no ordering, so
# every one of them answered false while equality kept working.
name = "TestStringOrder"
main = "TestStringOrder"
hl = "test_string_order.hl"
slow = false
timeout_secs = 60
expectation = "exact"
normalize = "default"

[[case]]
# Narrow values (i1/i8/i16) written through a dynamic field, all of which
# reach hlp_dyn_seti's i32 parameter. Passing a Bool's i1 register straight
# through built a call the LLVM verifier rejected, which drops the whole
# program to the interpreter rather than failing loudly.
name = "TestDynSetNarrow"
main = "TestDynSetNarrow"
hl = "test_dynset_narrow.hl"
slow = false
timeout_secs = 60
expectation = "exact"
normalize = "default"

