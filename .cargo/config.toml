# Keep repository Cargo config platform-neutral.
# Use local environment variables or per-user Cargo config for machine-specific settings.

# WebAssembly is the exception, because these are not machine settings: they
# are what the target IS. An ash program's exception handling is `setjmp`, and
# WebAssembly has none, so the backend has to rewrite it into the exceptions
# proposal. That rewrite is these two flags, and it is not optional -- built
# without them, `ash_std` links against a plain `longjmp` that nothing
# defines, and the module ash produces has no exception tag for a `catch` to
# match. Both halves have to agree, and the compiler sets the same two for the
# code it emits (crates/ash/src/target_abi.rs).
#
# `wasm-use-legacy-eh=false` picks the standardised `try_table`/`exnref`
# encoding. LLVM still defaults to the withdrawn `try`/`catch` instructions,
# which current engines refuse by name.
[target.wasm32-wasip1]
rustflags = [
  "-Ctarget-feature=+exception-handling",
  "-Cllvm-args=-wasm-enable-sjlj",
  "-Cllvm-args=-wasm-use-legacy-eh=false",
]

# The same for the threads target, which is the same wasm with atomics and a
# shared memory. Without these it links against a plain `longjmp` that nothing
# defines, exactly as wasm32-wasip1 does.
[target.wasm32-wasip1-threads]
rustflags = [
  "-Ctarget-feature=+exception-handling",
  "-Cllvm-args=-wasm-enable-sjlj",
  "-Cllvm-args=-wasm-use-legacy-eh=false",
]

[target.wasm32-wasip2]
rustflags = [
  "-Ctarget-feature=+exception-handling",
  "-Cllvm-args=-wasm-enable-sjlj",
  "-Cllvm-args=-wasm-use-legacy-eh=false",
]

# The same reasoning for the sqlite library's C half. libsqlite3-sys HAS a
# wasm branch that sets exactly these, but it tests `TARGET == "wasm32-wasi"`
# and ours is `wasm32-wasip1`, so it never fires -- and the default it falls
# back to is `SQLITE_THREADSAFE=1`, which fails to compile against a sysroot
# with no pthreads: "This mode of WASI does not have threads enabled". A
# sysroot that HAS the stubs builds it and then imports mutex functions the
# library never needs, so the flags are the fix on both.
#
# Set here rather than in scripts/build_wasm_hdll.py because clippy and a
# plain `cargo check` build this crate too, and a flag only the build script
# knows is a flag CI does not have.
[env]
LIBSQLITE3_FLAGS = "-USQLITE_THREADSAFE -DSQLITE_THREADSAFE=0 -DLONGDOUBLE_TYPE=double -D_WASI_EMULATED_MMAN -D_WASI_EMULATED_GETPID -D_WASI_EMULATED_SIGNAL -D_WASI_EMULATED_PROCESS_CLOCKS"
