[package]
name = "ash_interp"
version = "0.1.0"
edition = "2021"
authors = ["Damilare Akinlaja <dreakinlaja@gmail.com>"]
license = "MIT"
description = "HashLink bytecode interpreter for ASH VM"

# `llvm` (default): the LLVM top tier of the ladder; off, Auto is Cranelift only.
[features]
default = ["llvm"]
llvm = ["dep:inkwell", "ash_core/llvm"]

[dependencies]
ash_native_call = { workspace = true }
ash_core = { path = "../ash", default-features = false }
air = { path = "../air" }
anyhow = { workspace = true }
inkwell = { workspace = true, optional = true }
beadie = { workspace = true }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
] }

[build-dependencies]
cc = "1"

# Runs each mode in a child process that leaves through `_exit`, as the CLI
# does; see the file's header.
[[test]]
name = "host_module"
harness = false
