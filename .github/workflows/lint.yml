name: lint

# Clippy across the whole workspace and every target, warnings denied.
# The build scripts run under clippy, so the job needs the same LLVM 21 /
# libclang environment as a real build.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    runs-on: ubuntu-24.04
    env:
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: Install LLVM 21 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gpg software-properties-common \
            libzstd-dev zlib1g-dev libxml2-dev libtinfo-dev libedit-dev libffi-dev
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21 all

      # ash_std first: its cdylib is embedded by the other crates' build
      # scripts, which also run under clippy.
      - name: Clippy
        run: |
          cargo build -p ash_std
          cargo clippy --workspace --all-targets -- -D warnings

  # Compile and link the full CLI against real Windows headers on every push.
  # Checking ash_std alone missed ash_interp's MSVC enum width and Unix API
  # regressions; cargo check would also miss unavailable CRT symbols at link
  # time. Use the same LLVM SDK as the release job so this is the release
  # build's Windows gate rather than a weaker approximation of it.
  windows-check:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt # bindgen pretty-prints through it

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-check

      - name: Cache LLVM 21
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: C:\llvm21
          key: llvm-21.1.2-x86_64-pc-windows-msvc

      - name: Install LLVM 21 (Windows)
        shell: pwsh
        env:
          # Disables the rich progress bars that deadlock PowerShell in CI
          MAMBA_NO_PROGRESS: "true"
          CI: "true"
        run: |
          Write-Host "Downloading Micromamba..."
          curl.exe -fsSL -o micromamba.tar.bz2 `
            https://micro.mamba.pm/api/micromamba/win-64/latest
          
          Write-Host "Extracting Micromamba using 7-Zip..."
          # 7z extracts the .bz2 to a .tar, then un-tars it into the 'mm' directory
          7z x micromamba.tar.bz2 -y | Out-Null
          7z x micromamba.tar -omm -y | Out-Null
          
          $mm = Join-Path (Resolve-Path mm).Path 'Library\bin\micromamba.exe'
          Write-Host "Found micromamba at $mm"
          
          Write-Host "Creating environment (this may take a few minutes)..."
          # --log-level=info forces sequential text logs instead of UI spinners
          & $mm create -y -p "$PWD\llvmenv" -c conda-forge --log-level=info `
            "llvmdev=21.1.8" "zlib" "libxml2-devel"

          # In PowerShell, native executables failing don't inherently fail the step
          if ($LASTEXITCODE -ne 0) {
            throw "Micromamba failed with exit code $LASTEXITCODE"
          }

          $prefix = "$PWD\llvmenv\Library"
          if (-not (Test-Path "$prefix\bin\llvm-config.exe")) {
            throw "llvmdev installed no llvm-config.exe under $prefix\bin"
          }
          
          # Prove the reported paths point at THIS install, not the build box.
          $libdir = & "$prefix\bin\llvm-config.exe" --libdir
          Write-Host "llvm-config --libdir = $libdir"
          if (-not (Test-Path $libdir)) {
            throw "llvm-config reports a libdir that does not exist: $libdir"
          }
          & "$prefix\bin\llvm-config.exe" --version

          # llvm-config names its system libraries by the file names LLVM was
          # BUILT against, and conda-forge has since renamed zstd's import
          # library. Alias it rather than pinning an old zstd, so a version
          # bump cannot quietly take the link out again.
          if ((Test-Path "$libdir\zstd.lib") -and
              -not (Test-Path "$libdir\zstd.dll.lib")) {
            Copy-Item "$libdir\zstd.lib" "$libdir\zstd.dll.lib"
          }

          # Check every library the linker will be told to open, here rather
          # than ten minutes later at link time, where it surfaces as a bare
          # LNK1181 naming only the first one missing. The Windows SDK supplies
          # its own, so those are not this environment's to provide.
          $sdk = @('psapi.lib','shell32.lib','ole32.lib','uuid.lib',
                   'advapi32.lib','ws2_32.lib','ntdll.lib','kernel32.lib',
                   'user32.lib','userenv.lib','dbghelp.lib','delayimp.lib',
                   'legacy_stdio_definitions.lib')
          $missing = @()
          foreach ($lib in (& "$prefix\bin\llvm-config.exe" `
                              --system-libs --link-static).Split(' ')) {
            $lib = $lib.Trim()
            if (-not $lib -or $sdk -contains $lib.ToLower()) { continue }
            if (-not (Test-Path (Join-Path $libdir $lib))) { $missing += $lib }
          }
          if ($missing.Count) {
            throw "llvm-config names system libraries this env does not provide: $($missing -join ', ')"
          }
          Write-Host "all llvm-config --system-libs resolve under $libdir"
          "LLVM_SYS_211_PREFIX=$prefix" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build (expected to fail until the port lands)
        shell: bash
        run: |
          cargo build --release -p ash_std
          cargo build --release -p ash

      # LLVM pulls zlib, zstd and libxml2 in through IMPORT libraries, so those
      # DLLs have to sit beside the exe: Windows searches the executable's own
      # directory first, and without them the process cannot start at all --
      # which surfaces as a bare exit 127 with no output, not a missing-DLL
      # message. Copying them here also makes the published archive standalone
      # rather than dependent on a conda env being on PATH.
      - name: Bundle the runtime DLLs the binary links against (Windows)
        shell: pwsh
        run: |
          $envBin = "$PWD\llvmenv\Library\bin"
          $needed = @('zlib.dll', 'zstd.dll', 'libxml2.dll')
          $missing = @()
          foreach ($dll in $needed) {
            $src = Join-Path $envBin $dll
            if (Test-Path $src) {
              Copy-Item $src target\release\ -Force
              Write-Host "bundled $dll"
            } else {
              $missing += $dll
            }
          }
          if ($missing.Count) {
            Write-Host "--- $envBin ---"
            Get-ChildItem $envBin -Filter *.dll | ForEach-Object { Write-Host "  $($_.Name)" }
            throw "the env provides no $($missing -join ', ') to sit beside the binary"
          }
          

      - name: Smoke test interpreter
        shell: bash
        run: |
          # Bundle the diagnostic / HashLink runtime
          if [ -f "target/release/ash_std.dll" ]; then
            echo "Bundling ash_std.dll and creating libhl aliases..."
            # *.dll above already copied ash_std.dll, but we need the HashLink names:
            
            # Keep a compatibility-named copy beside ash for native extensions
            cp target/release/ash_std.dll target/release/libhl.dll
            
            # HashLink 1.x CMake builds import libhl.1.dll. 
            # We copy instead of symlink because Windows symlinks can require 
            # Admin rights/Developer Mode and break user extraction.
            cp target/release/ash_std.dll target/release/libhl.1.dll
          else
            echo "::warning::ash_std.dll not found; installed ash will extract its runtime on every run"
          fi
          ./target/release/ash.exe --mode interp crates/ash/test/tests/test_basic.hl
