<!doctype html>
<!-- generated by ash; rewritten on every wasm build while this line is here -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__ASH_MODULE__</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0 auto; padding: 2rem 1rem; max-width: 48rem; }
  #out { white-space: pre-wrap; border-left: 3px solid currentColor; padding: .8rem 1rem; min-height: 8rem; }
  #screen { display: block; width: 100%; height: auto; margin: 0 0 1rem; background: #0e0e12; image-rendering: pixelated; }
  .err { color: #d33; }
  .meta { opacity: .55; }
</style>
<canvas id="screen" width="640" height="360" hidden></canvas>
<pre id="out"></pre>
<script type="module">
// The program runs in worker.js, never on this thread: a Haxe main loop does
// not return, and Atomics.wait is forbidden here.
const module = "./__ASH_MODULE__";
const out = document.getElementById("out");
const write = (text, cls) => {
  const line = document.createElement("span");
  if (cls) line.className = cls;
  line.textContent = text + "\n";
  out.appendChild(line);
};

if (!self.crossOriginIsolated) {
  write("Not cross-origin isolated: a threaded module has no shared memory here. Serve this directory with `ash serve`.", "meta");
}

// Made on the first frame a program presents. The canvas goes to its own
// agent, because the one running the program never returns to its event loop
// and a frame drawn there would not reach the page until the program ended.
let display = null;
// The canvas can be given away once: to display.js, or to an agent that
// draws on it itself (a GPU agent keeps it as its surface).
let screenTaken = false;
const takeScreen = () => {
  if (screenTaken) return null;
  screenTaken = true;
  const screen = document.getElementById("screen");
  screen.hidden = false;
  return screen.transferControlToOffscreen();
};
const worker = new Worker("./worker.js", { type: "module" });
worker.onmessage = ({ data }) => {
  if (data.kind === "done") {
    for (const agent of threadAgents) agent.terminate();
    document.title = `${module.slice(2)} — ${data.trapped ? "trapped" : "done"}`;
    return;
  }
  // A service the program asked for (`ash_host_agent`): its module sits
  // beside this page as <name>_agent.mjs.
  if (data.kind === "spawn-agent") {
    const agent = new Worker(new URL(`./${data.name}_agent.mjs`, location.href), { type: "module" });
    agent.onerror = (e) => write(`${data.name} agent: ${e.message}`, "err");
    // An agent that draws asks for the canvas once, right after it starts:
    // `{ canvas }` if it was still here to give, `{ canvas: null }` if not.
    let answered = false;
    agent.onmessage = ({ data: asked }) => {
      if (asked?.kind !== "canvas" || answered) return;
      answered = true;
      const canvas = takeScreen();
      agent.postMessage({ canvas }, canvas ? [canvas] : []);
    };
    agent.postMessage({ memory: data.memory, address: data.address });
    return;
  }
  if (data.kind === "display") {
    if (!display) {
      const canvas = takeScreen();
      if (!canvas) return; // an agent that draws already has it
      display = new Worker("./display.js");
      display.postMessage({ canvas }, [canvas]);
    }
    display.postMessage(data);
    return;
  }
  write(data.text, data.kind === "err" ? "err" : data.kind === "meta" ? "meta" : "");
};
worker.onerror = (e) => write(`worker: ${e.message}`, "err");

const query = new URLSearchParams(location.search);
// The agents Haxe threads run on, made here rather than in worker.js: some
// browsers (Chrome on Android) cannot start a Worker from inside a Worker.
// Each gets one end of a channel and worker.js the other, and threads are
// handed over it. One that fails to start is left out; the threads it would
// have run take turns on the main scheduler.
const threadAgents = [];
function startThreadAgents(count) {
  return Promise.all(Array.from({ length: count }, () => new Promise((settle) => {
    const agent = new Worker("./thread.js", { type: "module" });
    let started = false;
    agent.onmessage = ({ data }) => {
      if (data.kind === "agent") {
        if (data.state === "ready" && !started) {
          started = true;
          const channel = new MessageChannel();
          agent.postMessage({ port: channel.port2 }, [channel.port2]);
          threadAgents.push(agent);
          settle(channel.port1);
        }
        return;
      }
      write(data.text, data.kind === "err" ? "err" : data.kind === "meta" ? "meta" : "");
    };
    agent.onerror = (e) => {
      if (started) return write(`thread agent: ${e.message}`, "err");
      write(`thread agent did not start: ${e.message || "no reason given"}`, "meta");
      settle(null);
    };
  }))).then((ports) => ports.filter(Boolean));
}
const agentPorts = await startThreadAgents(Math.max(1, (navigator.hardwareConcurrency || 4) - 1));
worker.postMessage(
  { module, args: [module.slice(2), ...query.getAll("arg")], display: true, agents: agentPorts },
  agentPorts,
);
</script>
