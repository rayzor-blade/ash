[package]
name = "ash_std"
version = "0.1.0"
edition = "2021"
authors = ["Damilare Akinlaja <dreakinlaja@gmail.com>"]
license = "MIT"
description = "Hashlink Std library for ASH"
keywords = ["Haxe", "HashLink"]

[dependencies]
flexstr = { workspace = true }
anyhow = { workspace = true }
libc = "0.2.158"
chrono = "0.4"
once_cell = "1.20.0"
fancy-regex = "0.18.0"
# Pure Rust zlib, for the fmt primitives a sandbox cannot load from an HDLL.
miniz_oxide = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Globalization",
    "Win32_System_Environment",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
winapi = { version = "0.3", features = ["debugapi", "winnt"] }

[lib]
# `staticlib` for AOT: the emitted object links the runtime in rather
# than dlopen-ing a cdylib, which wasm cannot do at all and which for
# native AOT would only relocate the C-wrapper problem into a dylib.
crate-type = ["cdylib", "rlib", "staticlib"]


[build-dependencies]
bindgen = "0.70.1"
cc = "1"

# Native fiber stack switching. A wasm module cannot switch stacks itself --
# there a fiber is driven by the host -- so the dependency is native-only and
# `fiber.rs` gates on the same condition.
# krio on every target, for different halves of itself. Natively it supplies
# the stack switch. On wasm `Fiber::new` panics by design -- the module's
# `__stack_pointer` names the shadow stack in linear memory while the call
# frames live in the engine, so swapping it moves the data half and leaves the
# control half behind -- but the free functions still compile, and
# `set_suspender` is how library code written against `yield_now` reaches the
# host's suspend operation.
[dependencies.krio-fiber]
git = "https://github.com/darmie/krio"

# The wasm side of the runtime, linked in rather than imported: see that
# crate's docs for why only fiber suspension crosses the module boundary.
[target.'cfg(target_family = "wasm")'.dependencies]
ash_wasm_runtime = { path = "../crates/ash_wasm_runtime", default-features = false, features = ["guest"] }
